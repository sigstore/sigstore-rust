[workspace]
resolver = "3"
members = [
    "crates/sigstore-types",
    "crates/sigstore-crypto",
    "crates/sigstore-merkle",
    "crates/sigstore-tsa",
    "crates/sigstore-trust-root",
    "crates/sigstore-tuf",
    "crates/sigstore-bundle",
    "crates/sigstore-rekor",
    "crates/sigstore-fulcio",
    "crates/sigstore-oidc",
    "crates/sigstore-verify",
    "crates/sigstore-sign",
    "crates/sigstore-conformance",
    "crates/sigstore-protobuf-compat",
]

[workspace.package]
version = "0.15.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sigstore/sigstore-rust"
rust-version = "1.86"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"

# Error handling
thiserror = "2.0"

# Cryptography
aws-lc-rs = { version = "1.18" }
boring = { version = "5", features = ["mldsa"] }
rand = "0.10.0"

# ASN.1 / X.509
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
pem = { version = "4.0" }
spki = { version = "0.7", features = ["alloc"] }
# To upgrade `const-oid`, first `spki` needs to be upgraded
const-oid = "0.9"
x509-cert = "0.2"
tls_codec = { version = "0.4", default-features = false, features = ["derive"] }

# RFC 3161 timestamp verification
cms = { version = "0.2", default-features = false }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "std"] }
rustls-pki-types = { version = "1.14", default-features = false, features = ["alloc"] }

# Ambient ID
ambient-id = { version = "0.0.11", default-features = false, features = [
  "reqwest-middleware",
] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
url = "2.5"

# Async
tokio = { version = "1.47" }

# Time
jiff = { version = "0.2", features = ["serde"] }
zeroize = "1"

# Testing
hex = "0.4"
rstest = { version = "0.28", default-features = false }
regex = "1.12"
insta = "1.48"

# Logging
tracing = { version = "0.1" }

# Serialization / JSON
serde_json_canonicalizer = "0.4"

# Glob matching within individual TUF path segments
# Keep this segment-based: glob's `**` extension must not cross `/`.
glob = "0.3"

# Async utilities
futures = "0.3"
futures-io = "0.3"

# Directory utilities
directories = "6.0"

# Atomic file writes / temp files
tempfile = "3.27.0"

# Browser opening
open = "5.3"

# Internal crates (path + version for publishing).
# `default-features = false` is set here so that downstream consumers can opt out
# of default TLS (`rustls`) or crypto (`aws-lc-rs`) features on top-level crates
# (e.g., `sigstore-verify = { default-features = false }` with a custom `CryptoProvider`)
# without intermediate crates unconditionally re-enabling `aws-lc-rs` or `rustls`.
# Each crate enables `aws-lc-rs` in its own `default` feature for standalone builds,
# and Cargo feature unification propagates `sigstore-crypto/aws-lc-rs` when enabled.
sigstore-types = { path = "crates/sigstore-types", version = "0.15.1" }
sigstore-crypto = { path = "crates/sigstore-crypto", version = "0.15.1", default-features = false }
sigstore-merkle = { path = "crates/sigstore-merkle", version = "0.15.1", default-features = false }
sigstore-tsa = { path = "crates/sigstore-tsa", version = "0.15.1", default-features = false }
sigstore-trust-root = { path = "crates/sigstore-trust-root", version = "0.15.1", default-features = false }
sigstore-tuf = { path = "crates/sigstore-tuf", version = "0.15.1", default-features = false }
sigstore-bundle = { path = "crates/sigstore-bundle", version = "0.15.1", default-features = false }
sigstore-rekor = { path = "crates/sigstore-rekor", version = "0.15.1", default-features = false }
sigstore-fulcio = { path = "crates/sigstore-fulcio", version = "0.15.1", default-features = false }
sigstore-oidc = { path = "crates/sigstore-oidc", version = "0.15.1", default-features = false }
sigstore-verify = { path = "crates/sigstore-verify", version = "0.15.1", default-features = false }
sigstore-sign = { path = "crates/sigstore-sign", version = "0.15.1", default-features = false }
