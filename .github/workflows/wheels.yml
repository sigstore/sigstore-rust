name: Build Python Wheels

on:
  push:
    tags:
      - "py-v*"
  pull_request:
    paths:
      - "crates/py-sigstore/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Linux — manylinux_2_28, x86_64 and aarch64
  # The maturin container already includes gcc; aws-lc-rs (non-FIPS) only
  # needs a C compiler, no cmake required.
  # ──────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/py-sigstore
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --locked --out dist
          # abi3-py310 wheel works on Python 3.10, 3.11, 3.12, 3.13+
          # No extra before-script needed; gcc is pre-installed in the container.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/py-sigstore/dist

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — x86_64 and arm64 (Apple Silicon)
  # ──────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel  # x86_64 GitHub-hosted macOS runner
          - target: aarch64-apple-darwin
            runner: macos-latest    # ARM64 (M-series)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/py-sigstore
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/py-sigstore/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Windows x86_64
  # The `prebuilt-nasm` crate feature (py-sigstore -> aws-lc-rs/prebuilt-nasm)
  # avoids requiring NASM to be installed separately in CI.
  # ──────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/py-sigstore
          target: x86_64
          args: >-
            --release --locked --out dist
            --features prebuilt-nasm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-x86_64
          path: crates/py-sigstore/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Source distribution (sdist) — required for PyPI completeness
  # ──────────────────────────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/py-sigstore
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: crates/py-sigstore/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Stub check — regenerate .pyi and fail if it differs from committed copy
  # ──────────────────────────────────────────────────────────────────────────
  stub-check:
    name: Stub file up-to-date check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # stub_gen links against libpython, so a Python must be available.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Regenerate stubs
        working-directory: crates/py-sigstore
        run: cargo run --bin stub_gen

      - name: Check for drift
        run: |
          git diff --exit-code crates/py-sigstore/python/sigstore/_internal/__init__.pyi \
            || (echo "ERROR: _internal/__init__.pyi is out of date. Run 'cargo run --bin stub_gen' and commit the result." && exit 1)

  # ──────────────────────────────────────────────────────────────────────────
  # Python test suite — runs after the Linux x86_64 wheel is built
  # Executes offline + network tests (not ci-marker signing tests).
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Python tests (${{ matrix.name }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, wheel: wheels-linux-x86_64, python: "3.10" }
          - { name: linux-x86_64, os: ubuntu-latest, wheel: wheels-linux-x86_64, python: "3.14" }
          - { name: macos-arm64, os: macos-latest, wheel: wheels-macos-aarch64-apple-darwin, python: "3.12" }
          - { name: windows-x86_64, os: windows-latest, wheel: wheels-windows-x86_64, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.wheel }}
          path: dist

      - name: Install wheel and pytest
        shell: bash
        run: |
          pip install dist/*.whl
          pip install pytest

      - name: Run offline tests
        working-directory: crates/py-sigstore
        run: pytest -m "not ci and not network"

      - name: Run network tests (TUF fetches)
        working-directory: crates/py-sigstore
        # Network tests make live requests to Sigstore TUF infrastructure.
        # They are separated so a transient network failure is clearly identified.
        run: pytest -m "network"

  # ──────────────────────────────────────────────────────────────────────────
  # Publish to PyPI — only on `py-v*` tags, after all wheels succeed
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [linux, macos, windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/py-sigstore
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
