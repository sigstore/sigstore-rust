[package]
name = "py-sigstore"
description = "Python bindings for the sigstore-rust library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Inherit the workspace MSRV (pyo3 0.29 is compatible with it)
rust-version.workspace = true
publish = false

[lib]
name = "_internal"
# cdylib: compiled Python extension module (.so / .pyd)
# rlib:   needed so the stub_gen binary can link against this crate
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Sigstore workspace crates
# The workspace sets default-features = false for most sigstore-* crates, so
# explicitly enable `rustls` (TLS backend), `tuf` (trust material / signing
# config fetch) and `aws-lc-rs` (crypto provider).
sigstore-types = { workspace = true }
sigstore-verify = { workspace = true, features = ["rustls", "tuf", "aws-lc-rs"] }
sigstore-sign = { workspace = true, features = ["rustls", "tuf", "aws-lc-rs"] }
sigstore-oidc = { workspace = true, features = ["rustls"] }
sigstore-trust-root = { workspace = true, features = ["tuf", "rustls"] }
