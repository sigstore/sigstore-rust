[package]
name = "sigstore-bundle"
description = "Bundle format handling for Sigstore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rustls"]
rustls = ["sigstore-rekor/rustls"]
native-tls = ["sigstore-rekor/native-tls"]

[dependencies]
sigstore-types = { workspace = true }
sigstore-rekor = { workspace = true, default-features = false }
serde_json = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
sigstore-merkle = { workspace = true }
